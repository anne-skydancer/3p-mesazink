name: Mesa Zink packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immutable package assets after both platforms pass
        type: boolean
        default: false
  push:
    branches: [main, codex/linux-mesazink-package, codex/zink-package-reliability]
    paths: [build_linux.py, build.py, package_support.py, autobuild.xml, '.github/workflows/linux-package.yml', 'patches/**', 'tests/**']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config bison flex patchelf libdrm-dev libglvnd-dev libx11-dev libxext-dev libxrandr-dev libxcb-xfixes0-dev libxfixes-dev libxdamage-dev libx11-xcb-dev libxcb-shm0-dev libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev libxcb-randr0-dev libxshmfence-dev libxxf86vm-dev libexpat1-dev zlib1g-dev libzstd-dev mesa-utils vulkan-tools mesa-vulkan-drivers xvfb xauth
          python -m pip install autobuild==3.9.3 meson mako packaging pyyaml setuptools zstandard
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build
        run: autobuild build -A 64 -c release --no-configure --id "$GITHUB_RUN_ID"
      - name: Verify runtime
        run: |
          set -euo pipefail
          for lib in build/lib/release/mesa/*.so*; do
            readelf -h "$lib" | grep 'Advanced Micro Devices X86-64'
            ldd "$lib" | tee -a build/dependencies.txt
          done
          ! grep 'not found' build/dependencies.txt
          export LD_LIBRARY_PATH="$PWD/build/lib/release/mesa"
          export __GLX_VENDOR_LIBRARY_NAME=vulkanstorm
          export MESA_LOADER_DRIVER_OVERRIDE=zink GALLIUM_DRIVER=zink LIBGL_KOPPER_DRI2=true
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          cat "$VK_DRIVER_FILES"
          vulkaninfo --summary
          export VK_LOADER_DEBUG=error,warn
          export LIBGL_ALWAYS_SOFTWARE=true
          xvfb-run -a glxinfo -B | tee build/glxinfo.txt
          grep -i 'OpenGL renderer string:.*zink' build/glxinfo.txt
      - name: Package
        run: |
          python package_support.py --verify build > build/verified-provenance.json
          VERSION=$(python package_support.py --version)
          autobuild package -A 64 --archive-format tzst --archive-name "$GITHUB_WORKSPACE/mesazink-$VERSION-linux64" --results-file build/package-results.txt
          sha256sum *.tar.zst > mesazink-linux64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: mesazink-linux64
          path: |
            *.tar.zst
            *.sha256
            build/package-results.txt
            build/glxinfo.txt
            build/dependencies.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-failure-logs
          path: mesa-src/build-linux-zink-*/meson-logs/

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install autobuild==3.9.3 meson ninja mako packaging pyyaml setuptools zstandard
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build
        run: autobuild build -A 64 -c release --no-configure --id "$env:GITHUB_RUN_ID"
      - name: Validate assembly and package
        shell: pwsh
        run: |
          python package_support.py --verify build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python package_support.py --version
          autobuild package -A 64 --archive-format tzst --archive-name "$env:GITHUB_WORKSPACE/mesazink-$version-windows64" --results-file build/package-results.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem *.tar.zst | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content mesazink-windows64.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: mesazink-windows64
          path: |
            *.tar.zst
            *.sha256
            build/package-results.txt
            build/package-provenance.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-failure-logs
          path: mesa-src/build-vulkanstorm-*/meson-logs/

  qualify:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install zstandard
      - uses: actions/download-artifact@v7
        with:
          pattern: mesazink-*
          path: packages
          merge-multiple: true
      - name: Verify both archive payloads and their shared identity
        run: python package_support.py --archives packages/*.tar.zst

  publish:
    needs: [qualify]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: mesazink-*
          path: packages
          merge-multiple: true
      - name: Publish once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python package_support.py --version)
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Mesa Zink $VERSION" --notes "Validated Windows/Linux package payloads. Linux smoke-tested with software Vulkan; Windows hardware rendering qualification is separate." packages/*.tar.zst packages/*.sha256
